<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Letrero Interactivo</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#b99d6b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Letrero">
    <link rel="apple-touch-icon" href="img/dreams2.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Cinzel:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════════════
           TIPOGRAFÍA FLUIDA — vmin escala con la dimensión menor
           Valores mínimos altos para legibilidad a distancia (TV/tablet)
        ═══════════════════════════════════════════════════════════ */
        :root {
            --font-size-xs:              clamp(0.6rem,  1.4vmin, 0.85rem);
            --font-size-sm:              clamp(0.75rem, 1.7vmin, 1.1rem);
            --font-size-base:            clamp(0.85rem, 1.9vmin, 1.3rem);
            --font-size-xl:              clamp(1rem,    2.6vmin, 1.9rem);
            --font-size-warning:         clamp(1.05rem, 2.6vmin, 2.1rem);
            --font-size-2xl:             clamp(1.35rem, 3.3vmin, 3.1rem);
            --font-size-table:           clamp(1.35rem, 4.3vmin, 3.9rem);
            --font-size-table-blackjack: clamp(1.35rem, 3.9vmin, 3.6rem);
            --font-size-minmax:          clamp(1.55rem, 4.6vmin, 4.2rem);
            --font-size-5xl:             clamp(2.1rem,  8.5vmin, 7.5rem);
            --font-size-5xl-compact:     clamp(1.7rem,  6.5vmin, 6rem);
        }

        body {
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
        }

        /* ═══════════════════════════════════════════════════════════
           FONDOS DE PANTALLA — cuerpo (visible en bordes/glow)
        ═══════════════════════════════════════════════════════════ */
        body.bg-logo     { background-color:#1a202c; background-image:url('img/dreams1.png'); background-size:100px; }
        body.bg-casino   { background-color:#0d1520; background-image:url('img/casino.jpg'); background-size:cover; background-position:center; }
        body.bg-cards    { background-color:#0f172a; }
        body.bg-felt     { background-color:#051a0d; }
        body.bg-dark     { background-color:#020202; }
        body.bg-wood     { background-color:#180b04; }
        body.bg-diamonds { background-color:#04071a; }

        /* ═══════════════════════════════════════════════════════════
           VARIABLES DE TEMA DE COLOR + VELOCIDAD DE EFECTO
           Aplicadas en #main-sign; heredadas por hijos via cascade
        ═══════════════════════════════════════════════════════════ */
        #main-sign {
            --border-color: #b99d6b;
            --glow-lo:      rgba(245,208,125,.50);
            --glow-hi:      rgba(245,208,125,.85);
            --glow-btn:     rgba(245,208,125,.70);
            --pulse-speed:  3s;
        }
        #main-sign.color-blue   { --border-color:#63b3ed; --glow-lo:rgba(99,179,237,.50);  --glow-hi:rgba(99,179,237,.90);  --glow-btn:rgba(99,179,237,.70);  --pulse-speed:1.8s; }
        #main-sign.color-red    { --border-color:#fc8181; --glow-lo:rgba(252,129,129,.50); --glow-hi:rgba(252,129,129,.90); --glow-btn:rgba(252,129,129,.70); --pulse-speed:0.9s; }
        #main-sign.color-green  { --border-color:#68d391; --glow-lo:rgba(104,211,145,.50); --glow-hi:rgba(104,211,145,.85); --glow-btn:rgba(104,211,145,.70); --pulse-speed:5s;   }
        #main-sign.color-purple { --border-color:#b794f4; --glow-lo:rgba(183,148,244,.50); --glow-hi:rgba(183,148,244,.90); --glow-btn:rgba(183,148,244,.70); --pulse-speed:2.5s; }
        #main-sign.color-white  { --border-color:#e2e8f0; --glow-lo:rgba(226,232,240,.40); --glow-hi:rgba(226,232,240,.75); --glow-btn:rgba(226,232,240,.60); --pulse-speed:7s;   }

        /* Logo responsivo — rectangular, altura automática según contenido */
        #open-config-btn {
            width:         clamp(7rem, 20vmin, 13rem);
            height:        auto;
            flex-shrink:   0;
            overflow:      hidden;
            border:        2px solid var(--border-color);
            box-shadow:    0 0 15px var(--glow-btn);
            background:    transparent;
            border-radius: .45rem;
            display:       flex;
            flex-direction: column;
            align-items:   center;
            transition: border-color .5s, box-shadow .5s, border-radius .3s;
        }

        /* Sección de imagen: muestra letras + estrellas (top 75% del original) */
        #logo-img-crop {
            width: 100%;
            overflow: hidden;
            aspect-ratio: 1080 / 585; /* = 75% de la altura de 780px */
        }
        #logo-img-crop img {
            width: 100%; height: auto; display: block;
            filter: url(#rm-white);
        }

        /* Texto "DREAMS" para modos Neón / Texto */
        #logo-dreams-text {
            display: none;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            color: var(--border-color);
            font-size: clamp(1rem, 3vmin, 2rem);
            letter-spacing: .14em;
            padding: .5em 0 .3em;
            width: 100%;
            justify-content: center;
        }
        @keyframes logo-pulse {
            0%,100% { text-shadow: 0 0 6px var(--glow-lo), 0 0 16px var(--glow-lo); }
            50%      { text-shadow: 0 0 14px var(--glow-hi), 0 0 32px var(--glow-hi), 0 0 55px var(--glow-lo); }
        }

        /* Ciudad debajo de la imagen */
        #logo-city {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            color: var(--border-color);
            font-size: clamp(.52rem, 1.4vmin, .88rem);
            letter-spacing: .22em;
            text-align: center;
            width: 100%;
            padding: .2rem .3rem .22rem;
            border-top: 1px solid var(--glow-lo);
            text-shadow: 0 0 8px var(--glow-lo);
        }

        /* Modos Neón / Texto: ocultar imagen, mostrar texto */
        #open-config-btn.logo-tipo-neon  #logo-img-crop,
        #open-config-btn.logo-tipo-texto #logo-img-crop  { display: none; }
        #open-config-btn.logo-tipo-neon  #logo-dreams-text,
        #open-config-btn.logo-tipo-texto #logo-dreams-text { display: flex; }
        #open-config-btn.logo-tipo-neon  #logo-dreams-text {
            animation: logo-pulse var(--pulse-speed) infinite ease-in-out;
        }
        #open-config-btn.logo-tipo-texto #logo-dreams-text {
            text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 2px 6px rgba(0,0,0,.6);
        }

        /* Formas */
        #open-config-btn.logo-circle { border-radius: 9999px; }
        #open-config-btn.logo-plain  { border: none !important; box-shadow: none !important; border-radius: .35rem; }

        /* Botones selector */
        .logo-shape-btn, .logo-tipo-btn  { display:flex; flex-direction:column; align-items:center; gap:.3rem; padding:.4rem .5rem; border-radius:.4rem; border:1px solid #4b5568; background:#374151; cursor:pointer; transition:border-color .15s,background .15s; flex:1; }
        .logo-shape-btn.active,
        .logo-tipo-btn.active  { border-color:#d97706; background:#44372a; }
        .logo-shape-btn:hover:not(.active),
        .logo-tipo-btn:hover:not(.active) { border-color:#6b7280; background:#4b5563; }
        .logo-shape-btn span, .logo-tipo-btn span { font-size:.68rem; color:#9ca3af; font-weight:600; }
        .logo-shape-btn.active span, .logo-tipo-btn.active span { color:#fbbf24; }

        /* ═══════════════════════════════════════════════════════════
           ANIMACIONES POR TEMA DE COLOR
        ═══════════════════════════════════════════════════════════ */
        .poker-sign { font-family:'Cinzel',serif; position:relative; transition:background-color .5s, border-color .5s; }

        /* ── Glow GPU-composited: anima opacity en ::after, NO box-shadow ── */
        @keyframes glow-pulse         { 0%,100%{opacity:0} 50%{opacity:1} }
        @keyframes glow-pulse-electric { 0%,20%,36%,45%,60%,100%{opacity:0} 28%{opacity:1} 40%{opacity:.15} 55%{opacity:1} }
        @keyframes glow-pulse-strobe   { 0%,46%,54%,100%{opacity:0} 50%{opacity:1} }

        .theme-poker {
            background: rgba(15,23,42,.96);
            border: 4px solid var(--border-color);
            box-shadow: 0 0 20px var(--glow-lo);
        }
        .theme-blackjack {
            background: rgba(26,42,69,.96);
            border: 4px solid var(--border-color);
            box-shadow: 0 0 20px var(--glow-lo);
        }
        /* Capa de glow composited — solo opacity se anima (GPU layer, sin repaint) */
        .theme-poker::after, .theme-blackjack::after {
            content: ''; position: absolute; inset: 0;
            border-radius: inherit;
            box-shadow: 0 0 55px var(--glow-hi);
            opacity: 0;
            animation: glow-pulse var(--pulse-speed) infinite ease-in-out;
            will-change: opacity;
            pointer-events: none;
        }
        #main-sign.color-blue   .theme-poker::after,
        #main-sign.color-blue   .theme-blackjack::after { animation-name: glow-pulse-electric; }
        #main-sign.color-red    .theme-poker::after,
        #main-sign.color-red    .theme-blackjack::after { animation-name: glow-pulse-strobe; }

        /* Cuando el layout casino está activo, #main-sign no necesita animar */
        #main-sign.casino-active .theme-poker::after,
        #main-sign.casino-active .theme-blackjack::after { animation: none; }

        /* ═══════════════════════════════════════════════════════════
           FONDOS APLICADOS DIRECTAMENTE AL PANEL (resuelve el
           problema de fondos invisibles detrás del panel opaco)
        ═══════════════════════════════════════════════════════════ */

        /* Casino: panel semi-transparente para ver la foto */
        body.bg-casino .theme-poker     { background:rgba(12,20,40,.87); }
        body.bg-casino .theme-blackjack { background:rgba(18,32,60,.87); }

        /* Naipes: gradiente oscuro sobre imagen en mosaico */
        body.bg-cards .theme-poker,
        body.bg-cards .theme-blackjack {
            background-color: #0c1528;
            background-image:
                linear-gradient(rgba(10,17,36,.82), rgba(10,17,36,.82)),
                url('img/cards.jpg');
            background-size: auto, 220px auto;
            background-repeat: no-repeat, repeat;
        }

        /* Fieltro verde */
        body.bg-felt .theme-poker,
        body.bg-felt .theme-blackjack {
            background: radial-gradient(ellipse at 50% 25%, rgba(18,75,42,.97) 0%, rgba(6,28,16,.98) 65%);
        }

        /* Oscuro total */
        body.bg-dark .theme-poker,
        body.bg-dark .theme-blackjack {
            background: rgba(4,4,6,.98);
        }

        /* Madera oscura */
        body.bg-wood .theme-poker {
            background-color: #1c0e05;
            background-image: repeating-linear-gradient(168deg, rgba(210,150,60,.045) 0, rgba(210,150,60,.045) 1px, transparent 1px, transparent 52px);
        }
        body.bg-wood .theme-blackjack {
            background-color: #1a1430;
            background-image: repeating-linear-gradient(168deg, rgba(210,150,60,.045) 0, rgba(210,150,60,.045) 1px, transparent 1px, transparent 52px);
        }

        /* Diamantes */
        body.bg-diamonds .theme-poker,
        body.bg-diamonds .theme-blackjack {
            background-color: #05081c;
            background-image:
                repeating-linear-gradient(45deg,  rgba(110,140,255,.08) 0, rgba(110,140,255,.08) 1px, transparent 0, transparent 20px),
                repeating-linear-gradient(-45deg, rgba(110,140,255,.08) 0, rgba(110,140,255,.08) 1px, transparent 0, transparent 20px);
            background-size: 20px 20px;
        }

        /* ═══════════════════════════════════════════════════════════
           CARRUSEL DE FRASES
        ═══════════════════════════════════════════════════════════ */
        #rules-container {
            overflow:hidden; position:relative; display:flex; align-items:center;
            min-height:2.5em; border-radius:.4rem;
            border:1px solid var(--border-color);
            background:rgba(0,0,0,.5);
            box-shadow:0 0 10px var(--glow-lo), inset 0 0 14px rgba(0,0,0,.35);
            transition:border-color .5s, box-shadow .5s;
        }

        /* — Modo marquee — */
        .carousel-marquee #marquee-wrap    { display:block; width:100%; overflow:hidden; white-space:nowrap; padding:.3em 0; }
        .carousel-marquee #rules-fade-text { display:none !important; }
        #rules-marquee-text { display:inline-block; font-weight:700; letter-spacing:.05em; color:var(--border-color); }
        @keyframes marquee-loop { from{transform:translateX(0)} to{transform:translateX(-50%)} }

        /* — Modo fade — */
        .carousel-fade #marquee-wrap { display:none !important; }
        .carousel-fade #rules-fade-text {
            display:flex !important; width:100%; justify-content:center; align-items:center;
            text-align:center; padding:.3em 1.2em;
            font-weight:700; letter-spacing:.05em; color:var(--border-color);
            transition:opacity .65s ease, transform .65s ease;
        }
        #rules-fade-text.carousel-out { opacity:0; transform:translateY(6px); }

        /* — Botones de estilo de carrusel — */
        .carousel-style-btn { flex:1; padding:.28rem .5rem; border-radius:.3rem; font-size:.72rem; font-weight:700; background:#374151; color:#9ca3af; border:1px solid #4b5568; cursor:pointer; transition:background .15s,color .15s; }
        .carousel-style-btn.active { background:#b45309; color:#fff; border-color:#d97706; }
        .carousel-style-btn:hover:not(.active) { background:#4b5563; color:#d1d5db; }

        /* ═══════════════════════════════════════════════════════════
           TABLA DE PAGOS + EFECTOS
        ═══════════════════════════════════════════════════════════ */
        .pay-table td { padding:clamp(.12rem,.48vmin,.48rem) clamp(.12rem,.42vmin,.42rem); }
        .pay-table tr { position:relative; overflow:hidden; }

        /* shimmer */
        @keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
        .effect-shimmer .pay-table tr::after {
            content:''; position:absolute; inset:0;
            background:linear-gradient(to right,transparent 20%,rgba(255,255,255,.35) 50%,transparent 80%);
            animation:shimmer 2.5s infinite linear;
            animation-delay:calc(var(--delay) * .8s);
        }

        /* none */
        .effect-none .pay-table tr::after { display:none; }

        /* pulse */
        @keyframes row-pulse { 0%,100%{opacity:1} 50%{opacity:.2} }
        .effect-pulse .pay-table tr { animation:row-pulse 1.8s infinite ease-in-out; animation-delay:calc(var(--delay) * .2s); }
        .effect-pulse .pay-table tr::after { display:none; }

        /* neon — solo opacity (composited), glow estático en text-shadow */
        @keyframes neon-opacity { 0%,100%{opacity:.45} 50%{opacity:1} }
        .effect-neon .pay-table td {
            animation: neon-opacity 2s infinite ease-in-out;
            animation-delay: calc(var(--delay) * .25s);
            text-shadow: 0 0 8px var(--glow-hi), 0 0 20px var(--glow-lo) !important;
            will-change: opacity;
        }
        .effect-neon .pay-table tr::after { display:none; }

        /* wave */
        @keyframes wave-slide {
            0%   { transform:translateX(-12px); opacity:.55; }
            50%  { transform:translateX(12px);  opacity:1; }
            100% { transform:translateX(-12px); opacity:.55; }
        }
        .effect-wave .pay-table tr { animation:wave-slide 2.5s infinite ease-in-out; animation-delay:calc(var(--delay) * .35s); }
        .effect-wave .pay-table tr::after { display:none; }

        /* rainbow — anima color del texto (hue-rotate no afecta blanco) */
        @keyframes rainbow-color {
            0%   { color:#ff6b6b; }
            16%  { color:#ffd93d; }
            33%  { color:#6bcb77; }
            50%  { color:#4ec9f0; }
            66%  { color:#c77dff; }
            83%  { color:#ff9a3c; }
            100% { color:#ff6b6b; }
        }
        .effect-rainbow .pay-table td {
            animation:rainbow-color 3s linear infinite;
            animation-delay:calc(var(--delay) * .4s);
        }
        .effect-rainbow .pay-table tr::after { display:none; }

        .pay-table-blackjack { font-size:var(--font-size-table-blackjack) !important; }
        .pay-table-blackjack td { padding-top:clamp(.32rem,1.3vmin,1.3rem); padding-bottom:clamp(.32rem,1.3vmin,1.3rem); }

        /* ═══════════════════════════════════════════════════════════
           MIN-MAX BOX
        ═══════════════════════════════════════════════════════════ */
        #min-max-box {
            border: 2px solid var(--border-color);
            border-radius: .5rem;
            box-shadow: 0 0 8px var(--border-color), 0 0 16px var(--glow-lo);
            position: relative;
        }
        #min-max-box::after {
            content: ''; position: absolute; inset: 0;
            border-radius: inherit;
            box-shadow: 0 0 12px var(--border-color), 0 0 28px var(--border-color), 0 0 40px var(--glow-hi);
            opacity: 0;
            animation: glow-pulse calc(var(--pulse-speed) * 0.85) infinite ease-in-out;
            will-change: opacity;
            pointer-events: none;
        }

        /* Pausa todas las animaciones cuando la página no es visible */
        .anim-paused * { animation-play-state: paused !important; }

        #config-panel { transition:opacity .3s ease-in-out,transform .3s ease-in-out; }

        .value-display { transition:opacity .3s ease-in-out,transform .3s ease-in-out; }
        .value-display.updating { opacity:0; transform:scale(.95); }

        /* ═══════════════════════════════════════════════════════════
           PANEL DE CONFIGURACIÓN — controles visuales
        ═══════════════════════════════════════════════════════════ */
        /* Toggle switch */
        .toggle-track { width:2.5rem; height:1.25rem; border-radius:9999px; background:#4b5563; transition:background .2s; cursor:pointer; position:relative; flex-shrink:0; }
        .toggle-track.on { background:#d97706; }
        .toggle-thumb { position:absolute; top:.1875rem; left:.1875rem; width:.875rem; height:.875rem; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.4); transition:transform .2s; }
        .toggle-track.on .toggle-thumb { transform:translateX(1.25rem); }

        /* Bolitas de tema de color */
        .theme-swatch {
            width:2rem; height:2rem; border-radius:50%;
            border:3px solid transparent; cursor:pointer;
            transition:transform .15s,border-color .15s; flex-shrink:0;
        }
        .theme-swatch.active { border-color:#fff; transform:scale(1.25); }
        .theme-swatch:hover  { transform:scale(1.1); }

        /* Miniaturas de fondo */
        .bg-btn { position:relative; height:2.8rem; border-radius:.4rem; border:2px solid #4a5568; cursor:pointer; overflow:hidden; transition:border-color .15s; }
        .bg-btn.active { border-color:#f6d860; box-shadow:0 0 0 1px #f6d860; }
        .bg-btn:hover  { border-color:#a0aec0; }
        .bg-btn span   { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.62rem; font-weight:700; letter-spacing:.01em; text-shadow:0 1px 4px rgba(0,0,0,.95); color:#fff; background:rgba(0,0,0,.22); }

        .bg-preview-logo     { background:#1a202c url('img/dreams1.png') center/40px; }
        .bg-preview-casino   { background-color:#1a202c; background-image:url('img/casino.jpg'); background-size:cover; background-position:center; }
        .bg-preview-cards    { background-color:#0f172a; background-image:url('img/cards.jpg'); background-size:70px auto; }
        .bg-preview-felt     { background:radial-gradient(ellipse at 50% 30%,#1a5c38 0%,#0a2e1a 100%); }
        .bg-preview-dark     { background:#030303; }
        .bg-preview-wood     { background-color:#2d1a0e; background-image:repeating-linear-gradient(168deg,rgba(0,0,0,.15) 0,rgba(0,0,0,.15) 1px,transparent 1px,transparent 28px); }
        .bg-preview-diamonds { background-color:#0a0f24; background-image:repeating-linear-gradient(45deg,rgba(110,140,255,.14) 0,rgba(110,140,255,.14) 1px,transparent 0,transparent 10px),repeating-linear-gradient(-45deg,rgba(110,140,255,.14) 0,rgba(110,140,255,.14) 1px,transparent 0,transparent 10px); background-size:10px 10px; }

        @media (max-height:500px) {
            #time-subtitle { display:none; }
            #min-change-info { padding-top:0; padding-bottom:0; }
        }

        /* ═══════════════════════════════════════════════════════════
           MOBILE: usa 100dvh para que la barra del navegador no corte
        ═══════════════════════════════════════════════════════════ */
        @supports (height: 100dvh) {
            #main-sign { height: 100dvh; }
        }

        /* ═══════════════════════════════════════════════════════════
           LAYOUT CASINO — retrato, replica letrero físico
        ═══════════════════════════════════════════════════════════ */
        #layout-casino { flex-direction: column; position: relative; }

        /* Marca de agua centrada al fondo */
        .cas-watermark {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(14rem, 70%, 28rem);
            height: auto;
            opacity: .10;
            pointer-events: none;
            z-index: 0;
        }
        #layout-casino > *:not(.cas-watermark) { position: relative; z-index: 1; }

        /* Título full-width */
        .cas-title-bar {
            text-align: center;
            padding: .55rem 1rem;
            flex-shrink: 0;
            border-bottom: 3px solid rgba(255,255,255,.38);
        }
        #cas-game-name {
            font-family: 'Barlow Condensed','Roboto',sans-serif;
            font-weight: 900; text-transform: uppercase; color: #fff;
            text-shadow: 2px 2px 8px rgba(0,0,0,.6);
            font-size: clamp(3rem, 15vw, 10rem);
            line-height: 1; letter-spacing: .03em;
        }

        /* Sección mínimo/máximo */
        .cas-minmax-section {
            padding: .45rem 1.1rem .3rem;
            flex-shrink: 0;
            border-bottom: 2px solid rgba(255,255,255,.32);
        }
        .cas-minmax-row-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            line-height: 1.2;
        }
        .cas-label {
            font-family: 'Barlow Condensed','Roboto',sans-serif;

            <button id="save-config-btn"
                    class="w-full bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2 px-4 rounded-lg transition-colors">
                Guardar Cambios
            </button>
        </div>
      </div>
    </div>

    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(err => console.error('SW error:', err));
      });
    }
</script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {

        // ── Fullscreen ──
        const fullscreenBtnConfig = document.getElementById('fullscreen-btn-config');
        const fullscreenBtnText   = document.getElementById('fullscreen-btn-text');
        const toggleFullScreen = () => !document.fullscreenElement
            ? document.documentElement.requestFullscreen().catch(e=>console.error(e))
            : document.exitFullscreen();
        const updateFSText = () => fullscreenBtnText.textContent = document.fullscreenElement ? 'Salir' : 'Pantalla';
        fullscreenBtnConfig.addEventListener('click', toggleFullScreen);
        document.addEventListener('fullscreenchange', updateFSText);

        // ── Wake Lock ──
        let wakeLock = null, wakeLockEnabled = false;
        const wakeLockBtn  = document.getElementById('wake-lock-btn');
        const wakeLockText = document.getElementById('wake-lock-status-text');
        const acquireWL = async () => {
            if ('wakeLock' in navigator && wakeLockEnabled) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLockText.textContent = 'ON';
                    wakeLockBtn.classList.replace('bg-gray-700','bg-green-600');
                    wakeLockBtn.classList.replace('hover:bg-gray-600','hover:bg-green-700');
                } catch(e){}
            }
        };
        const releaseWL = async () => {
            if (wakeLock) {
                await wakeLock.release(); wakeLock = null;
                wakeLockText.textContent = 'Pantalla ON';
                wakeLockBtn.classList.replace('bg-green-600','bg-gray-700');
                wakeLockBtn.classList.replace('hover:bg-green-700','hover:bg-gray-600');
            }
        };
        wakeLockBtn.addEventListener('click', async () => {
            wakeLockEnabled = !wakeLockEnabled;
            wakeLockEnabled ? await acquireWL() : await releaseWL();
        });
        document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') acquireWL(); });
        if (!('wakeLock' in navigator)) {
            wakeLockBtn.disabled = true; wakeLockText.textContent = 'N/A';
            wakeLockBtn.classList.add('opacity-50','cursor-not-allowed');
        }

        // ── Toggle hora de cambio ──
        const toggleTrack      = document.getElementById('toggle-track');
        const changeTimeFields = document.getElementById('change-time-fields');
        let changeTimeEnabled  = false;

        function syncToggle(enabled) {
            changeTimeEnabled = enabled;
            toggleTrack.classList.toggle('on', enabled);
            changeTimeFields.classList.toggle('opacity-40', !enabled);
            changeTimeFields.classList.toggle('pointer-events-none', !enabled);
        }
        toggleTrack.addEventListener('click', () => syncToggle(!changeTimeEnabled));
        toggleTrack.addEventListener('keydown', e => { if(e.key===' '||e.key==='Enter'){e.preventDefault();syncToggle(!changeTimeEnabled);} });

        // ── Datos de juegos ──
        const payTables = {
            "Draw Poker":              { hasSideBet:false, useCasino:true,  shortName:"DRAW POKER",      pays:[{hand:"Escalera REAL",payout:"100 A 1"},{hand:"Escalera Color",payout:"50 A 1"},{hand:"Poker",payout:"20 A 1"},{hand:"Full",payout:"7 A 1"},{hand:"Color",payout:"5 A 1"},{hand:"Escalera",payout:"3 A 1"},{hand:"Trío",payout:"2 A 1"},{hand:"Dos Pares",payout:"1 A 1"},{hand:"Un Par",payout:"1 A 1"}]},
            "Caribbean Poker Plus":    { hasSideBet:false, useCasino:true,  shortName:"CARIBBEAN POKER",  pays:[{hand:"Escalera REAL",payout:"100 A 1"},{hand:"Escalera Color",payout:"50 A 1"},{hand:"Poker",payout:"20 A 1"},{hand:"Full",payout:"7 A 1"},{hand:"Color",payout:"5 A 1"},{hand:"Escalera",payout:"4 A 1"},{hand:"Trío",payout:"3 A 1"},{hand:"Dos Pares",payout:"2 A 1"},{hand:"Un Par",payout:"1 A 1"}]},
            "Hold'em Texas Poker Plus":{ hasSideBet:false, useCasino:true,  shortName:"HOLD'EM POKER", pays:[{hand:"Escalera Real",payout:"100 A 1"},{hand:"Escalera Color",payout:"20 A 1"},{hand:"Poker",payout:"10 A 1"},{hand:"Full",payout:"3 A 1"},{hand:"Color",payout:"2 A 1"},{hand:"Escalera",payout:"1 A 1"},{hand:"Trío",payout:"1 A 1"},{hand:"Dos Pares",payout:"1 A 1"},{hand:"Un Par",payout:"1 A 1"}]},
            "Black Jack Par Perfecto": { hasSideBet:true,  useCasino:true,  shortName:"BLACK JACK",    pays:[{hand:"Par Perfecto",subtitle:"Par de la misma pinta y color",payout:"25 A 1"},{hand:"Par Color",subtitle:"Par del mismo color",payout:"15 A 1"},{hand:"Par Mixto",subtitle:"Par rojo y negro",payout:"5 A 1"}]}
        };

        // ── DOM refs ──
        const mainSignEl          = document.getElementById('main-sign');
        const layoutStandardEl    = document.getElementById('layout-standard');
        const layoutCasinoEl      = document.getElementById('layout-casino');
        const casGameNameEl       = document.getElementById('cas-game-name');
        const casMinValEl         = document.getElementById('cas-min-val');
        const casMaxValEl         = document.getElementById('cas-max-val');
        const casSidebetColEl     = document.getElementById('cas-sidebet-row');
        const casSbMinEl          = document.getElementById('cas-sb-min-val');
        const casSbMaxEl          = document.getElementById('cas-sb-max-val');
        const casPayBodyEl        = document.getElementById('cas-pay-table-body');
        const casPayHeaderEl      = document.getElementById('cas-paytable-header');
        const casSoloCarouselEl   = document.getElementById('cas-solo-carousel');
        const gameTitleEl         = document.getElementById('game-title');
        const minBetEl            = document.getElementById('min-bet');
        const maxBetEl            = document.getElementById('max-bet');
        const timeSubtitleEl      = document.getElementById('time-subtitle');
        const minChangeInfoEl     = document.getElementById('min-change-info');
        const payTableEl          = document.getElementById('pay-table');
        const payTableBodyEl      = document.getElementById('pay-table-body');
        const countdownEl         = document.getElementById('countdown-location');
        const configPanel         = document.getElementById('config-panel');
        const openConfigBtn       = document.getElementById('open-config-btn');
        const closeConfigBtn      = document.getElementById('close-config-btn');
        const saveConfigBtn       = document.getElementById('save-config-btn');
        const gameNameSelect      = document.getElementById('game-name-select');
        const changeHourSelect    = document.getElementById('change-hour');
        const changeMinuteSelect  = document.getElementById('change-minute');
        const baseMinInput        = document.getElementById('base-min-bet');
        const baseMaxInput        = document.getElementById('base-max-bet');
        const newMinInput         = document.getElementById('new-min-bet');
        const newMaxInput         = document.getElementById('new-max-bet');
        const rulesInput          = document.getElementById('rules-input');
        const rulesContainerEl    = document.getElementById('rules-container');
        const rulesMarqueeTextEl  = document.getElementById('rules-marquee-text');
        const rulesFadeTextEl     = document.getElementById('rules-fade-text');
        const sideBetInfoEl       = document.getElementById('side-bet-info');
        const sideBetContainer    = document.getElementById('side-bet-config-container');
        const sbBaseMin           = document.getElementById('side-bet-base-min');
        const sbBaseMax           = document.getElementById('side-bet-base-max');
        const sbNewMin            = document.getElementById('side-bet-new-min');
        const sbNewMax            = document.getElementById('side-bet-new-max');
        const tableEffectSelect   = document.getElementById('table-effect-select');

        // ── Config ──
        let config;
        const defaultConfig = {
            gameName: "Draw Poker",
            changeTimeEnabled: false, changeTime: '22:00',
            baseMin: 3000, newMin: 5000,
            baseMax: 100000, newMax: 100000,
            colorTheme: 'gold', tableEffect: 'shimmer', minmaxEffect: 'none', background: 'logo', carouselStyle: 'marquee',
            rules: ["NO OCUPAR EL TELÉFONO EN LA MESA","EL JUEGO ES PERSONAL","SOLO JUGADORES SENTADOS"],
            gameSettings: {
                "Black Jack Par Perfecto": { baseMinBet:500, baseMaxBet:2000, newMinBet:500, newMaxBet:4000 }
            }
        };

        // ── Formatters ──
        const fmtCLP   = n => new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',minimumFractionDigits:0}).format(n);
        const fmtInput = n => new Intl.NumberFormat('es-CL').format(n);
        const unformat = s => parseInt(s.replace(/\./g,''),10)||0;

        function animateValue(el, val, isHTML=false) {
            const cur = isHTML ? el.innerHTML : el.textContent;
            if (cur !== val) {
                el.classList.add('updating');
                setTimeout(() => { isHTML ? el.innerHTML=val : el.textContent=val; el.classList.remove('updating'); }, 300);
            }
        }

        // ── Aplicar ajustes visuales ──
        function applyBackground(bg) {
            document.body.className = document.body.className.replace(/\bbg-\S+/g,'').trim();
            document.body.classList.add('bg-'+bg);
            document.querySelectorAll('.bg-btn').forEach(b => b.classList.toggle('active', b.dataset.bg===bg));
        }

        function applyColorTheme(color) {
            mainSignEl.className = mainSignEl.className.replace(/\bcolor-\S+/g,'').trim();
            if (color !== 'gold') mainSignEl.classList.add('color-'+color);
            document.querySelectorAll('.theme-swatch').forEach(s => s.classList.toggle('active', s.dataset.color===color));
        }

        function applyTableEffect(effect) {
            mainSignEl.className = mainSignEl.className.replace(/\beffect-\S+/g,'').trim();
            mainSignEl.classList.add('effect-'+effect);
            if (tableEffectSelect) tableEffectSelect.value = effect;
        }

        function applyMinmaxEffect(effect) {
            const casinoEl = document.getElementById('layout-casino');
            casinoEl.className = casinoEl.className.replace(/\bmm-effect-\S+/g,'').trim();
            if (effect !== 'none') casinoEl.classList.add('mm-effect-'+effect);
            const sel = document.getElementById('minmax-effect-select');
            if (sel) sel.value = effect;
        }

        // ── Carrusel de frases ──
        let fadeCarouselIndex = 0;
        let fadeCarouselTimer = null;
        let casFadeIndex = 0;
        let casFadeTimer = null;

        function applyLogoTipo(tipo) {
            openConfigBtn.className = openConfigBtn.className.replace(/\blogo-tipo-\S+/g,'').trim();
            if (tipo !== 'foto') openConfigBtn.classList.add('logo-tipo-' + tipo);
            document.querySelectorAll('.logo-tipo-btn').forEach(b =>
                b.classList.toggle('active', b.dataset.ltipo === tipo));
        }

        function applyLogoShape(shape) {
            openConfigBtn.className = openConfigBtn.className.replace(/\blogo-\S+/g,'').trim();
            if (shape !== 'square') openConfigBtn.classList.add('logo-' + shape);
            document.querySelectorAll('.logo-shape-btn').forEach(b =>
                b.classList.toggle('active', b.dataset.lshape === shape));
        }

        function applyCarouselStyle(style) {
            rulesContainerEl.classList.toggle('carousel-fade',    style === 'fade');
            rulesContainerEl.classList.toggle('carousel-marquee', style === 'marquee');
            document.querySelectorAll('.carousel-style-btn').forEach(b =>
                b.classList.toggle('active', b.dataset.cstyle === style));
            if (style === 'fade') {
                startFadeCarousel();
            } else {
                if (fadeCarouselTimer) { clearInterval(fadeCarouselTimer); fadeCarouselTimer = null; }
            }
        }

        function startFadeCarousel() {
            if (fadeCarouselTimer) { clearInterval(fadeCarouselTimer); fadeCarouselTimer = null; }
            const phrases = config.rules || [];
            if (!phrases.length) { rulesFadeTextEl.textContent = ''; return; }
            fadeCarouselIndex = 0;
            rulesFadeTextEl.textContent = phrases[0];
            rulesFadeTextEl.classList.remove('carousel-out');
            if (phrases.length <= 1) return;
            fadeCarouselTimer = setInterval(() => {
                rulesFadeTextEl.classList.add('carousel-out');
                setTimeout(() => {
                    fadeCarouselIndex = (fadeCarouselIndex + 1) % phrases.length;
                    rulesFadeTextEl.textContent = phrases[fadeCarouselIndex];
                    rulesFadeTextEl.classList.remove('carousel-out');
                }, 680);
            }, 5000);
        }

        function updateMarquee() {
            const phrases = config.rules || [];

            // Reinicia carrusel casino (.cas-solo)
            if (casFadeTimer) { clearInterval(casFadeTimer); casFadeTimer = null; }
            if (!phrases.length) {
                rulesMarqueeTextEl.textContent = '';
                rulesMarqueeTextEl.style.animation = 'none';
                rulesFadeTextEl.textContent = '';
                casSoloCarouselEl.textContent = 'SOLO JUGADORES SENTADOS';
                casSoloCarouselEl.style.opacity = '1';
                return;
            }

            // Layout estándar — marquee
            const sep = "  ◆  ";
            const oneCopy = phrases.join(sep) + sep;
            rulesMarqueeTextEl.textContent = oneCopy + oneCopy;
            const dur = Math.min(120, Math.max(18, oneCopy.length * 0.24));
            rulesMarqueeTextEl.style.animation = `marquee-loop ${dur}s linear infinite`;
            if (config.carouselStyle === 'fade') startFadeCarousel();

            // Layout casino — fade rotativo en .cas-solo
            casFadeIndex = 0;
            casSoloCarouselEl.style.opacity = '1';
            casSoloCarouselEl.textContent = phrases[0];
            if (phrases.length > 1) {
                casFadeTimer = setInterval(() => {
                    casSoloCarouselEl.style.opacity = '0';
                    setTimeout(() => {
                        casFadeIndex = (casFadeIndex + 1) % phrases.length;
                        casSoloCarouselEl.textContent = phrases[casFadeIndex];
                        casSoloCarouselEl.style.opacity = '1';
                    }, 500);
                }, 5000);
            }
        }

        // ── Tabla de pagos ──
        function renderPayTable(gameName, isNewActive) {
            const gd = payTables[gameName];
            const gs = config.gameSettings[gameName];
            if (gd.hasSideBet && gs) {
                const min = isNewActive ? gs.newMinBet : gs.baseMinBet;
                const max = isNewActive ? gs.newMaxBet : gs.baseMaxBet;
                animateValue(sideBetInfoEl,
                    `Valor Par Perfecto:<br><span class="font-normal">${fmtCLP(min)}</span> / <span class="font-normal">${fmtCLP(max)}</span>`,
                    true);
                sideBetInfoEl.classList.remove('hidden');
            } else sideBetInfoEl.classList.add('hidden');

            payTableBodyEl.innerHTML = '';
            gd.pays.forEach((item, i) => {
                payTableBodyEl.innerHTML +=
                    `<tr style="--delay:${i*.2};"><td class="font-semibold">${item.hand}</td><td class="text-right font-bold">${item.payout}</td></tr>`;
            });
        }

        function updateSideBetConfigUI() {
            const g = gameNameSelect.value;
            if (payTables[g]?.hasSideBet) {
                const s = config.gameSettings[g] || defaultConfig.gameSettings[g];
                sbBaseMin.value=fmtInput(s.baseMinBet); sbBaseMax.value=fmtInput(s.baseMaxBet);
                sbNewMin.value =fmtInput(s.newMinBet);  sbNewMax.value =fmtInput(s.newMaxBet);
                sideBetContainer.classList.remove('hidden');
            } else sideBetContainer.classList.add('hidden');
        }

        function populateFormSelects() {
            Object.keys(payTables).forEach(name => {
                const o=document.createElement('option'); o.value=name; o.textContent=name; gameNameSelect.appendChild(o);
            });
            for(let i=0;i<24;i++){const o=document.createElement('option'); o.value=i.toString().padStart(2,'0'); o.textContent=o.value; changeHourSelect.appendChild(o);}
            ['00','15','30','45'].forEach(m=>{const o=document.createElement('option'); o.value=m; o.textContent=m; changeMinuteSelect.appendChild(o);});
        }

        function loadConfig() {
            const saved = localStorage.getItem('pokerConfigV44');
            config = saved ? {...defaultConfig,...JSON.parse(saved)} : {...defaultConfig};
            if (!config.gameSettings) config.gameSettings = {};
            Object.keys(payTables).forEach(g => {
                if (payTables[g].hasSideBet && !config.gameSettings[g])
                    config.gameSettings[g] = defaultConfig.gameSettings[g];
            });
            gameNameSelect.value    = config.gameName;
            const [h,m]             = (config.changeTime||'22:00').split(':');
            changeHourSelect.value  = h; changeMinuteSelect.value = m;
            syncToggle(!!config.changeTimeEnabled);
            baseMinInput.value = fmtInput(config.baseMin); baseMaxInput.value = fmtInput(config.baseMax);
            newMinInput.value  = fmtInput(config.newMin);  newMaxInput.value  = fmtInput(config.newMax);
            rulesInput.value   = config.rules.join('\n');
            tableEffectSelect.value = config.tableEffect||'shimmer';
            updateSideBetConfigUI();
            applyBackground(config.background||'logo');
            applyColorTheme(config.colorTheme||'gold');
            applyTableEffect(config.tableEffect||'shimmer');
            applyCarouselStyle(config.carouselStyle||'marquee');
            applyMinmaxEffect(config.minmaxEffect||'none');
        }

        function saveConfig() {
            config.gameName          = gameNameSelect.value;
            config.changeTimeEnabled = changeTimeEnabled;
            config.changeTime        = `${changeHourSelect.value}:${changeMinuteSelect.value}`;
            config.baseMin = unformat(baseMinInput.value); config.baseMax = unformat(baseMaxInput.value);
            config.newMin  = unformat(newMinInput.value);  config.newMax  = unformat(newMaxInput.value);
            config.rules       = rulesInput.value.split('\n').filter(r=>r.trim()!=='');
            config.tableEffect   = tableEffectSelect.value;
            config.minmaxEffect  = (document.getElementById('minmax-effect-select')||{}).value || 'none';
            applyMinmaxEffect(config.minmaxEffect);
            const g = config.gameName;
            if (payTables[g]?.hasSideBet) {
                config.gameSettings[g] = {
                    baseMinBet:unformat(sbBaseMin.value), baseMaxBet:unformat(sbBaseMax.value),
                    newMinBet: unformat(sbNewMin.value),  newMaxBet: unformat(sbNewMax.value),
                };
            }
            localStorage.setItem('pokerConfigV44', JSON.stringify(config));
            closePanel(); checkTime(); updateMarquee();
        }

        function openPanel()  { configPanel.classList.remove('hidden'); }
        function closePanel() { configPanel.classList.add('hidden'); }

        // ── Lógica de hora de cambio ──
        function isNewMinimumActive() {
            if (!config.changeTimeEnabled) return false;
            const now = new Date();
            const [th,tm] = config.changeTime.split(':').map(Number);
            const nowMin  = now.getHours()*60+now.getMinutes();
            const tgtMin  = th*60+tm;
            return (nowMin>=tgtMin)||((tgtMin-nowMin)>12*60);
        }

        function renderCasinoLayout(gameName, isNewActive) {
            const gd = payTables[gameName];
            const gs = config.gameSettings[gameName];
            casGameNameEl.textContent = gd.shortName || gameName;
            const minAmt = isNewActive ? config.newMin : config.baseMin;
            const maxAmt = isNewActive ? config.newMax : config.baseMax;
            casMinValEl.textContent = fmtCLP(minAmt);
            casMaxValEl.textContent = fmtCLP(maxAmt);
            if (gd.hasSideBet && gs) {
                const sbMin = isNewActive ? gs.newMinBet : gs.baseMinBet;
                const sbMax = isNewActive ? gs.newMaxBet : gs.baseMaxBet;
                casSbMinEl.textContent = fmtCLP(sbMin);
                casSbMaxEl.textContent = fmtCLP(sbMax);
                casSidebetColEl.classList.add('visible');
                casPayHeaderEl.style.display = 'none';
            } else {
                casSidebetColEl.classList.remove('visible');
                casPayHeaderEl.style.display = 'block';
            }
            casPayBodyEl.innerHTML = '';
            gd.pays.forEach((item, i) => {
                const sub = item.subtitle ? `<span class="cas-row-subtitle">${item.subtitle}</span>` : '';
                casPayBodyEl.innerHTML += `<tr style="--delay:${i*.2};"><td>${item.hand}${sub}</td><td>${item.payout}</td></tr>`;
            });
        }

        function updateDisplay(isNewActive) {
            const gameName = config.gameName;
            const gd = payTables[gameName];
            // Tema visual (siempre)
            if (gameName === "Black Jack Par Perfecto") {
                mainSignEl.classList.remove('theme-poker');
                mainSignEl.classList.add('theme-blackjack');
            } else {
                mainSignEl.classList.remove('theme-blackjack');
                mainSignEl.classList.add('theme-poker');
            }
            if (gd?.useCasino) {
                layoutStandardEl.style.display = 'none';
                layoutCasinoEl.style.display   = 'flex';
                mainSignEl.classList.add('casino-active');
                renderCasinoLayout(gameName, isNewActive);
            } else {
                layoutCasinoEl.style.display   = 'none';
                layoutStandardEl.style.display  = 'flex';
                mainSignEl.classList.remove('casino-active');
                const minAmt = isNewActive ? config.newMin : config.baseMin;
                const maxAmt = isNewActive ? config.newMax : config.baseMax;
                const longTitle = gameName === "Caribbean Poker Plus";
                gameTitleEl.style.fontSize = longTitle ? 'var(--font-size-5xl-compact)' : 'var(--font-size-5xl)';
                animateValue(gameTitleEl, gameName);
                animateValue(minBetEl, fmtCLP(minAmt));
                animateValue(maxBetEl, fmtCLP(maxAmt));
                renderPayTable(gameName, isNewActive);
                payTableEl.classList.remove('pay-table-blackjack');
                minBetEl.classList.toggle('text-green-400',  !isNewActive);
                minBetEl.classList.toggle('text-orange-400',  isNewActive);
            }
        }

        function checkTime() {
            const newActive = isNewMinimumActive();
            updateDisplay(newActive);
            if (!config.changeTimeEnabled) {
                timeSubtitleEl.textContent=''; minChangeInfoEl.textContent='';
                countdownEl.textContent=''; countdownEl.classList.remove('text-orange-400','font-bold','animate-pulse');
                return;
            }
            const now = new Date();
            const [th,tm] = config.changeTime.split(':').map(Number);
            const nowMin  = now.getHours()*60+now.getMinutes();
            const tgtMin  = th*60+tm;
            if (newActive) {
                let passed = nowMin - tgtMin; if(passed<0) passed+=24*60;
                timeSubtitleEl.textContent = (passed<1) ? 'Mínimos actualizados.' : '';
                minChangeInfoEl.textContent=''; countdownEl.textContent='';
                countdownEl.classList.remove('text-orange-400','font-bold','animate-pulse');
            } else {
                const minsLeft = tgtMin - nowMin;
                timeSubtitleEl.textContent='';
                if (minsLeft>0&&minsLeft<=5) {
                    countdownEl.textContent = `¡CAMBIO A ${fmtCLP(config.newMin)} EN ${minsLeft} MINUTO${minsLeft===1?'':'S'}!`;
                    countdownEl.classList.add('text-orange-400','font-bold','animate-pulse');
                    minChangeInfoEl.textContent='';
                } else {
                    countdownEl.textContent='';
                    countdownEl.classList.remove('text-orange-400','font-bold','animate-pulse');
                    minChangeInfoEl.textContent = `Estos mínimos son hasta las ${config.changeTime}, luego suben a ${fmtCLP(config.newMin)}`;
                }
            }
        }

        function handleNumberInput(e) {
            const input=e.target, pos=input.selectionStart, origLen=input.value.length;
            const raw=input.value.replace(/[^0-9]/g,'');
            if(!raw){input.value='';return;}
            const fmt=fmtInput(parseInt(raw,10));
            if(input.value!==fmt){input.value=fmt; const np=pos+(fmt.length-origLen); input.setSelectionRange(np,np);}
        }

        // ── Eventos ──
        document.querySelectorAll('#config-panel input[inputmode="numeric"]').forEach(i=>i.addEventListener('input',handleNumberInput));
        openConfigBtn.addEventListener('click', openPanel);
        document.getElementById('cas-open-config-btn').addEventListener('click', openPanel);
        closeConfigBtn.addEventListener('click', closePanel);
        saveConfigBtn.addEventListener('click', saveConfig);
        gameNameSelect.addEventListener('change', updateSideBetConfigUI);
        configPanel.addEventListener('click', e=>{
            const inner = document.getElementById('config-panel-inner');
            if(e.target===configPanel||e.target===inner) closePanel();
        });

        document.querySelectorAll('.theme-swatch').forEach(btn => {
            btn.addEventListener('click', () => { config.colorTheme=btn.dataset.color; applyColorTheme(btn.dataset.color); });
        });

        document.querySelectorAll('.bg-btn').forEach(btn => {
            btn.addEventListener('click', () => { config.background=btn.dataset.bg; applyBackground(btn.dataset.bg); });
        });

        tableEffectSelect.addEventListener('change', () => applyTableEffect(tableEffectSelect.value));

        document.getElementById('minmax-effect-select').addEventListener('change', e => {
            config.minmaxEffect = e.target.value;
            applyMinmaxEffect(e.target.value);
        });

        document.querySelectorAll('.carousel-style-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                config.carouselStyle = btn.dataset.cstyle;
                applyCarouselStyle(btn.dataset.cstyle);
            });
        });

        populateFormSelects();
        loadConfig();
        checkTime();
        updateMarquee();
        setInterval(checkTime, 10000);

        // Pausa todas las animaciones CSS cuando la pestaña no es visible
        document.addEventListener('visibilitychange', () => {
            document.documentElement.classList.toggle('anim-paused', document.hidden);
        });
    });
    </script>
</body>
</html>
